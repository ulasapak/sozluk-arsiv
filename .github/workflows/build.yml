name: Uygulamayi derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac-AppleSilicon
          - os: macos-15-intel
            name: Mac-Intel
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araclari kur
        run: pip install pyinstaller certifi

      - name: Derle (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name "Sozluk Arsiv" sozluk_arsiv.py

      - name: Derle (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --name "Sozluk Arsiv" sozluk_arsiv.py
          tar czf "Sozluk-Arsiv-Linux.tar.gz" -C dist "Sozluk Arsiv"
          rm -rf dist/*
          mv "Sozluk-Arsiv-Linux.tar.gz" dist/

      - name: Derle (Mac)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name "Sozluk Arsiv" sozluk_arsiv.py
          cd dist
          ditto -c -k --keepParent "Sozluk Arsiv.app" "Sozluk-Arsiv-${{ matrix.name }}.zip"
          rm -rf "Sozluk Arsiv.app" "Sozluk Arsiv"

      - uses: actions/upload-artifact@v4
        with:
          name: Sozluk-Arsiv-${{ matrix.name }}
          path: dist/*
